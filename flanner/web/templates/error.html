{% extends "base.html" %}
{% block title %}{{ status_label }}{% endblock %}

{% block topbar_main %}
<h1>{{ status_label }}</h1>
{% endblock %}

{% block content %}
<div class="pane">
  <div class="card empty">
    <h2>{{ status_code }} {{ status_label }}</h2>
    <p>{{ detail }}</p>
    <a class="btn btn-primary" href="/">Back to Dashboard</a>
  </div>
</div>
{% endblock %}
