[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flanner"
version = "0.4.1"
description = "Plan file management for AI assistants via MCP"
authors = [{ name = "Jayson Mulwa", email = "jayson.mulwa@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "claude", "codex", "ai-agents", "plan-files", "markdown", "cli", "planning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13.0,<16",
    "sqlalchemy>=2.0,<3",
    "python-frontmatter>=1.0,<2",
    "pyyaml>=6.0,<7",
    "fastapi>=0.104,<1",
    "uvicorn>=0.24,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.6,<0.1",
    "markdown>=3.5,<4",
    "pygments>=2.17,<3",
    "pydantic>=2.5,<3",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0,<9",
    "httpx>=0.25,<1",
    "ruff>=0.8",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.5",
    "types-PyYAML",
    "types-Markdown",
]

[project.scripts]
flanner = "flanner.cli:cli"
flanner-mcp = "flanner.server:main"

[project.urls]
Homepage = "https://flanner.io"
Repository = "https://github.com/jaysonmulwa/flanner"
Changelog = "https://github.com/jaysonmulwa/flanner/blob/main/CHANGELOG.md"
Issues = "https://github.com/jaysonmulwa/flanner/issues"

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
[tool.ruff.lint.per-file-ignores]
# assert, hardcoded tmp paths, and a 0.0.0.0 bind literal (to test the
# non-local-bind warning) are fine in tests and benchmarks
"tests/*" = ["S101", "S104", "S108", "S603", "S607"]
"benchmarks/*" = ["S101", "S603", "S607"]

[tool.setuptools.packages.find]
include = ["flanner*"]

[tool.setuptools.package-data]
flanner = ["web/templates/*.html", "web/static/**/*"]
